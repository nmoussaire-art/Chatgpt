name: Build LoopGuard APK

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # Mapped to env because the `secrets` context is not usable in `if:`.
    env:
      KEYSTORE_BASE64: ${{ secrets.LOOPGUARD_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14

      # ------------------------------------------------------------------
      # Release signing.
      #
      # Set these four repository secrets (Settings -> Secrets and variables
      # -> Actions). Without them the job still builds, but produces an
      # unsigned release APK that Android will refuse to install.
      #
      #   LOOPGUARD_KEYSTORE_BASE64  - base64 of signing/loopguard-release.jks
      #   LOOPGUARD_KEYSTORE_PASSWORD
      #   LOOPGUARD_KEY_ALIAS
      #   LOOPGUARD_KEY_PASSWORD
      # ------------------------------------------------------------------
      - name: Restore signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/loopguard-release.jks
          echo "Keystore restored ($(stat -c%s signing/loopguard-release.jks) bytes)"

      - name: Build signed release APK
        env:
          LOOPGUARD_KEYSTORE_PATH: signing/loopguard-release.jks
          LOOPGUARD_KEYSTORE_PASSWORD: ${{ secrets.LOOPGUARD_KEYSTORE_PASSWORD }}
          LOOPGUARD_KEY_ALIAS: ${{ secrets.LOOPGUARD_KEY_ALIAS }}
          LOOPGUARD_KEY_PASSWORD: ${{ secrets.LOOPGUARD_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify the signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -3

      - name: Name the artefact after the version
        id: rename
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/LoopGuard-v${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=dist/LoopGuard-v${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload the APK as a build artefact
        uses: actions/upload-artifact@v4
        with:
          name: LoopGuard-v${{ steps.rename.outputs.version }}
          path: ${{ steps.rename.outputs.apk }}
          retention-days: 90

      - name: Attach the APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.rename.outputs.apk }}" --clobber
